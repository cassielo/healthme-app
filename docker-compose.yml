services:
  web:
    build: .
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: healthme
      DB_USER: healthme
      DB_PASSWORD: localdev
    depends_on:
      - db

  db:
    image: mysql:8.4
    # Same as Aiven: primary keys required, ANSI and strict SQL mode
    command: ["--sql-require-primary-key=ON", "--sql-mode=ANSI,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"]
    environment:
      MYSQL_DATABASE: healthme
      MYSQL_USER: healthme
      MYSQL_PASSWORD: localdev
      MYSQL_ROOT_PASSWORD: localdev
    volumes:
      - ./healthme.sql:/docker-entrypoint-initdb.d/healthme.sql
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data:
